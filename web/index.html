<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Telc B1/B2 imtahanına online tayarlanıw. Lesen, Hören, Schreiben, Sprechen mashqları hám AI oqıtıwshı.">

  <!-- Open Graph (Telegram, WhatsApp, Facebook) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://berlin-nukus-n1.web.app/">
  <meta property="og:title" content="Berlin-Nukus - Nemis tili oqıw orayı">
  <meta property="og:description" content="Telc B1/B2 imtahanına online tayarlanıw. Lesen, Hören, Schreiben, Sprechen mashqları hám AI oqıtıwshı.">
  <meta property="og:image" content="https://berlin-nukus-n1.web.app/icons/Icon-512.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Berlin-Nukus - Nemis tili oqıw orayı">
  <meta name="twitter:description" content="Telc B1/B2 imtahanına online tayarlanıw. Lesen, Hören, Schreiben, Sprechen mashqları hám AI oqıtıwshı.">
  <meta name="twitter:image" content="https://berlin-nukus-n1.web.app/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Berlin-Nukus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Berlin-Nukus - Nemis tili oqıw orayı</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Sign-In meta tag (Firebase Console -> Authentication -> Sign-in method -> Google -> Web SDK configuration -> Web client ID) -->
  <meta name="google-signin-client_id" content="901891657911-un0jqsg46o6i3chmm1q8657lsq8ck4do.apps.googleusercontent.com">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Eski service worker'ni tozalash. Ilova endi service worker'siz quriladi
    (`flutter build web --release --pwa-strategy=none`), shuning uchun oldingi
    versiyada ro'yxatdan o'tgan SW ni olib tashlaymiz — aks holda u eski
    keshlangan versiyani ko'rsatishda davom etadi va yangilanish ko'rinmaydi.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (const registration of registrations) {
          registration.unregister();
        }
      }).catch(function () {});
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
