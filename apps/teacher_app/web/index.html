  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #131F24;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #131F24;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.4s ease-out;
    }

    .logo-container {
      position: relative;
      width: 90px;
      height: 90px;
      margin-bottom: 18px;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      animation: pulse-logo 2s infinite ease-in-out;
    }

    .app-title {
      color: #FFFFFF;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .app-subtitle {
      color: rgba(255, 255, 255, 0.55);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 28px;
    }

    .spinner-bar {
      width: 38px;
      height: 38px;
      border: 3.5px solid rgba(255, 255, 255, 0.12);
      border-top-color: #58CC02;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      font-weight: 600;
      margin-top: 14px;
      letter-spacing: 0.3px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse-logo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <!-- Instant HTML/CSS Splash Loader for Telegram and Web Browsers -->
  <div id="loading-indicator">
    <div class="logo-container">
      <img src="icons/Icon-192.png" alt="AwaDe Logo" class="logo-img">
    </div>
    <div class="app-title">AwaDe</div>
    <div class="app-subtitle">Nemis tili platforması</div>
    <div class="spinner-bar"></div>
    <div class="loading-text">Yuklanmoqda...</div>
  </div>

  <script>
    // Service worker cleanup
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (const registration of registrations) {
          registration.unregister();
        }
      }).catch(function () {});
    }

    // Function to hide loading splash indicator smoothly
    function hideLoading() {
      var loading = document.getElementById('loading-indicator');
      if (loading && loading.style.opacity !== '0') {
        loading.style.opacity = '0';
        setTimeout(function() {
          if (loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }
        }, 450);
      }
    }

    // Listen for Flutter first frame event
    window.addEventListener('flutter-first-frame', hideLoading);

    // Fallback: Observe DOM for flutter elements in case event is missed
    var observer = new MutationObserver(function (mutations, obs) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        hideLoading();
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Safety timeout in case initialization takes too long
    setTimeout(hideLoading, 15000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
