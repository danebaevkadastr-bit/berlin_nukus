name = "berlinnukus-proxy"
main = "index.js"
compatibility_date = "2025-04-07"
compatibility_flags = ["web_socket_manual_reply_to_close"]

# ─────────────────────────────────────────────────────────────────────────────
# DURABLE OBJECT — Gemini Live WebSocket proksisi uchun. Oddiy Worker uzoq WS
# oqimida evict bo'lib "internal error" beradi; DO esa ulanish davomida tirik
# turadi. SQLite-backed DO bepul tarifda ham ishlaydi.
# ─────────────────────────────────────────────────────────────────────────────
[[durable_objects.bindings]]
name = "LIVE_RELAY"
class_name = "LiveRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRelay"]

# ─────────────────────────────────────────────────────────────────────────────
# RATE LIMITING (IP bo'yicha) — Cloudflare native rate limiter.
# Har bir IP uchun 60 soniyada 30 ta so'rovga ruxsat (kerak bo'lsa o'zgartiring).
# ─────────────────────────────────────────────────────────────────────────────
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# ─────────────────────────────────────────────────────────────────────────────
# MAXFIY BO'LMAGAN o'zgaruvchilar (vars) — bularni shu yerga yozsa bo'ladi.
# GEMINI_AUDIO_MODEL: Sprechen audio baholash uchun model (ixtiyoriy).
# Berilmasa worker default `gemini-2.5-flash` ishlatadi. Ko'p foydalanuvchi
# bo'lsa `gemini-2.5-flash-lite` (kunlik limit kattaroq) tavsiya etiladi.
# ─────────────────────────────────────────────────────────────────────────────
[vars]
GEMINI_AUDIO_MODEL = "gemini-2.5-flash"

# ─────────────────────────────────────────────────────────────────────────────
# MAXFIY KALITLAR (Secrets) — bu yerga YOZILMAYDI!
# Quyidagi buyruqlar bilan Cloudflare'ga xavfsiz joylanadi:
#
#   wrangler secret put APP_TOKEN              # ilova yuboradigan maxfiy token
#   wrangler secret put QWEN_API_KEY
#   wrangler secret put CEREBRAS_API_KEY
#   wrangler secret put MISTRAL_API_KEY
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put ONESIGNAL_REST_API_KEY
#   wrangler secret put AWS_ACCESS_KEY_ID
#   wrangler secret put AWS_SECRET_ACCESS_KEY
#
# Har bir buyruqdan keyin terminal qiymatni so'raydi (ekranda ko'rinmaydi).
# ─────────────────────────────────────────────────────────────────────────────
